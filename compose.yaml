services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evaluation_lab
      POSTGRES_USER: evaluation_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluation_lab -d evaluation_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://evaluation_lab:${POSTGRES_PASSWORD}@db:5432/evaluation_lab
      RUNNER_URL: http://runner:8001
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AI_REVIEW_PROVIDER: ${AI_REVIEW_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_REVIEW_MODEL: ${OLLAMA_REVIEW_MODEL:-qwen3.5:4b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6-terra}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
    restart: unless-stopped

  runner:
    image: ai-code-evaluation-python-runner:0.1.0
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in your environment}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8001"
    restart: unless-stopped

volumes:
  postgres_data:
